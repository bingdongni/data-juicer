name: Punctuation normalization regression

on:
  push:
    branches: ['ci/preserve-fullwidth-digits']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch
        run: python -m pip install 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Install project and test dependencies
        run: python -m pip install -e . pytest 'ray==2.52.0'
      - name: Run normalization tests
        run: python -m pytest tests/ops/mapper/test_punctuation_normalization_mapper.py tests/ops/mapper/test_whitespace_normalization_mapper.py -q
      - name: Check changed source formatting
        run: |
          python -m pip install 'black==25.1.0' 'isort==5.12.0' 'flake8==6.1.0' 'flake8-pyproject' 'flake8-black==0.3.6'
          black --check data_juicer/ops/mapper/punctuation_normalization_mapper.py
          isort --check-only data_juicer/ops/mapper/punctuation_normalization_mapper.py
          flake8 data_juicer/ops/mapper/punctuation_normalization_mapper.py
